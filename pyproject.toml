[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-pipeline"
version = "0.1.0"
description = "Recoverable Kafka feature pipeline and gRPC fraud scoring"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka==2.8.2", "redis==5.2.1", "grpcio==1.71.0",
  "protobuf==5.29.4", "numpy==2.2.4", "pandas==2.2.3",
  "scikit-learn==1.6.1", "xgboost==3.0.0", "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "grpcio-tools==1.71.0", "ruff==0.11.2"]

[project.scripts]
fraud = "fraud_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
