name: fraud-pipeline

x-app: &app
  build: .
  image: fraud-pipeline:local
  restart: unless-stopped
  environment: &environment
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_URL: redis://redis:6379/0
    PIPELINE_NAMESPACE: fraud
    KAFKA_PARTITIONS: 4
    METRICS_PORT: 8000
  depends_on:
    init:
      condition: service_completed_successfully
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts:ro

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  init:
    <<: *app
    command: ["init-topics"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker-0:
    <<: *app
    command: ["worker"]
    environment:
      <<: *environment
      WORKER_PARTITION: 0
  worker-1:
    <<: *app
    command: ["worker"]
    environment:
      <<: *environment
      WORKER_PARTITION: 1
  worker-2:
    <<: *app
    command: ["worker"]
    environment:
      <<: *environment
      WORKER_PARTITION: 2
  worker-3:
    <<: *app
    command: ["worker"]
    environment:
      <<: *environment
      WORKER_PARTITION: 3
  materializer:
    <<: *app
    command: ["materialize"]
  scorer:
    <<: *app
    command: ["serve"]
    environment:
      <<: *environment
      MODEL_DIR: /app/artifacts/model
      ALLOW_DEMO_MODEL: ${ALLOW_DEMO_MODEL:-1}
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:${SCORER_METRICS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
  producer:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    command: ["replay", "--input", "data/transactions.jsonl", "--rate", "1000"]
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  k6:
    image: grafana/k6:0.57.0
    profiles: ["benchmarks"]
    working_dir: /work/benchmarks
    environment:
      TARGET: scorer:50051
      RATE: ${RATE:-100}
      DURATION: ${DURATION:-30s}
      REQUIRE_TRAINED: "1"
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ./benchmarks:/work/benchmarks:ro
      - ./contracts:/work/contracts:ro
      - ./data:/work/data:ro
      - ./reports:/work/reports
    command: ["run", "--summary-export", "/work/reports/k6-scoring.json", "scoring.js"]
    depends_on:
      scorer:
        condition: service_healthy
  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  kafka-data:
  redis-data:
